[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbz"
version = "1.1.0"
description = "Interactive Qobuz catalog search and complete lossless downloader"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }

authors = [
  { name = "Trevor Jeremy" }
]

keywords = [
  "qobuz",
  "music",
  "flac",
  "lossless",
  "hi-res",
  "cli",
  "downloader",
  "metadata",
  "audio"
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Utilities"
]

dependencies = [
  "requests>=2.31",
  "rich>=13.7",
  "questionary>=2.0",
  "InquirerPy>=0.3.4",
  "mutagen>=1.47",
  "cryptography>=42",
  "platformdirs>=4.2",
  "pyfiglet>=1.0.2",
]

[project.urls]
Homepage = "https://github.com/worstgirlinamerica/qbz-cli"
Repository = "https://github.com/worstgirlinamerica/qbz-cli"
Issues = "https://github.com/worstgirlinamerica/qbz-cli/issues"
Releases = "https://github.com/worstgirlinamerica/qbz-cli/releases"

[project.scripts]
qbz = "qbz.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
