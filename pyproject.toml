[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qbz-cli"
version = "0.2.0"
description = "Interactive Qobuz catalog search and complete lossless downloader"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "requests>=2.31",
  "rich>=13.7",
  "questionary>=2.0",
  "InquirerPy>=0.3.4",
  "mutagen>=1.47",
  "cryptography>=42",
  "platformdirs>=4.2",
  "pyfiglet>=1.0.2",
]

[project.scripts]
qbz = "qbz.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
